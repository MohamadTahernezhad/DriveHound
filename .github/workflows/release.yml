name: Release

# Push a tag like v2.1.0 to build the installers and publish a GitHub Release.
# If docs/release-notes/<tag>.md exists it becomes the release description.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check that the tag matches package.json
        shell: bash
        run: |
          v="v$(node -p "require('./package.json').version")"
          if [ "$v" != "$GITHUB_REF_NAME" ]; then echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $v"; exit 1; fi
      - run: npm run build:native
      - run: npm test
      - name: Build installers
        run: npx electron-builder --win nsis portable --publish never
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem release -Filter *.exe | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content release/SHA256SUMS.txt -Encoding ascii
      - name: Release notes
        id: notes
        shell: bash
        run: |
          f="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$f" ]; then echo "path=$f" >> "$GITHUB_OUTPUT"; fi
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: DriveHound ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
